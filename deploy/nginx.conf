# Sample nginx site for a Hoodoo build (dist/) served at the root of a host.
# These are the headers the public instance sends; tools/serve-dist.mjs reads the
# add_header lines below to preview a build with exactly the same policy.

server {
    listen 8080;
    server_name _;
    root /srv/hoodoo;

    autoindex off;
    disable_symlinks on;
    server_tokens off;
    client_max_body_size 1k;

    # Hashed build files never change; everything else revalidates (so updates and
    # the service worker arrive on the next load).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/hoodoo-security.conf;
    }
    location ~ /\. { return 404; }
    # The stock mime table predates web app manifests, and nosniff needs the right type.
    location ~ \.webmanifest$ {
        types {}
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/hoodoo-security.conf;
    }
    location / {
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/hoodoo-security.conf;
        try_files $uri $uri/ =404;
    }
}

# /etc/nginx/hoodoo-security.conf
# The app paints textures into data: and blob: images, registers its own service
# worker (through the Trusted Types policy "hoodoo-sw") and talks to nothing else.
#
# add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types hoodoo-sw" always;
# add_header Cross-Origin-Opener-Policy "same-origin" always;
# add_header Cross-Origin-Resource-Policy "same-origin" always;
# add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), display-capture=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
# add_header Referrer-Policy "no-referrer" always;
